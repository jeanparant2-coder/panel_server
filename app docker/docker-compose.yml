services:
  panel:
    image: ghcr.io/jeanparant2-coder/panel_server:latest
    container_name: nodepilot
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PORT: "8080"
      DATA_DIR: /data
      DOCKER_SOCKET: /var/run/docker.sock
    restart: unless-stopped
